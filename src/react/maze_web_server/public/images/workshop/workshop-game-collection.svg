<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Collection">
  <!-- The front card of the hub's collection stack: a card with two games (a
       second gamepad fanned up-and-right behind the front one). -->
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <symbol id="padplain" viewBox="0 0 64 32">
      <rect x="7" y="4" width="50" height="24" rx="12" fill="url(#g)"/>
    </symbol>
    <symbol id="pad" viewBox="0 0 64 32">
      <rect x="7" y="4" width="50" height="24" rx="12" fill="url(#g)"/>
      <rect x="15" y="14" width="13" height="4.2" rx="2" fill="#fff"/>
      <rect x="19.4" y="9.6" width="4.2" height="13" rx="2" fill="#fff"/>
      <circle cx="42" cy="12.5" r="2.7" fill="#fff"/>
      <circle cx="48.5" cy="19" r="2.7" fill="#fff"/>
      <circle cx="42" cy="19" r="2.7" fill="#fff" opacity=".7"/>
    </symbol>
  </defs>
  <rect x="1" y="3" width="62" height="40" rx="8" fill="url(#c)" stroke="#c7d0dc" stroke-width="1.5"/>
  <use href="#padplain" x="9.6" y="5" width="52" height="26"/>
  <use href="#pad" x="2.1" y="13" width="55" height="27.5"/>
</svg>
