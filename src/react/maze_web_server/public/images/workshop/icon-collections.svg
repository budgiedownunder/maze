<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="My Game Collections">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <symbol id="pad" viewBox="0 0 64 32">
      <rect x="7" y="4" width="50" height="24" rx="12" fill="url(#g)"/>
      <rect x="15" y="14" width="13" height="4.2" rx="2" fill="#fff"/>
      <rect x="19.4" y="9.6" width="4.2" height="13" rx="2" fill="#fff"/>
      <circle cx="42" cy="12.5" r="2.7" fill="#fff"/>
      <circle cx="48.5" cy="19" r="2.7" fill="#fff"/>
      <circle cx="42" cy="19" r="2.7" fill="#fff" opacity=".7"/>
    </symbol>
  </defs>
  <!-- stack of three light-gray collection cards; front card carries one gamepad -->
  <rect x="18" y="12" width="34" height="22" rx="4.5" fill="url(#c)" stroke="#c7d0dc" stroke-width="1.5"/>
  <rect x="14" y="20" width="34" height="22" rx="4.5" fill="url(#c)" stroke="#c7d0dc" stroke-width="1.5"/>
  <rect x="10" y="28" width="34" height="22" rx="4.5" fill="url(#c)" stroke="#c7d0dc" stroke-width="1.5"/>
  <use href="#pad" x="12" y="31.5" width="30" height="15"/>
</svg>
