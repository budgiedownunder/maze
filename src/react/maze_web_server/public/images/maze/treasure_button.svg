<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Treasure">
  <rect x="0" y="0" width="32" height="32" fill="#ffffff"/>
  <!-- A pile of treasure built from small copies of the per-style loot icons:
       silver + gold coins at the base, jewels + diamonds gems on top. -->

  <!-- silver coin (base-left) -->
  <g transform="translate(10 20) scale(0.5) translate(-16 -16)">
    <circle cx="16" cy="16" r="14" fill="#c9ced6" stroke="#111111" stroke-width="2"/>
    <circle cx="16" cy="16" r="10.5" fill="#dfe3e9" stroke="#9aa2ad" stroke-width="1.4"/>
    <circle cx="16" cy="16" r="6.5" fill="none" stroke="#aab1bb" stroke-width="1.4"/>
    <ellipse cx="12.4" cy="11.6" rx="3" ry="2" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- gold coin (base-right) -->
  <g transform="translate(21 21) scale(0.5) translate(-16 -16)">
    <circle cx="16" cy="16" r="14" fill="#e7ad2e" stroke="#111111" stroke-width="2"/>
    <circle cx="16" cy="16" r="10.5" fill="#f4cf5e" stroke="#b8860b" stroke-width="1.4"/>
    <circle cx="16" cy="16" r="6.5" fill="none" stroke="#c8941a" stroke-width="1.4"/>
    <ellipse cx="12.4" cy="11.6" rx="3" ry="2" fill="#fff2c4" opacity="0.7"/>
  </g>

  <!-- jewels gem (top-left) -->
  <g transform="translate(10.5 11) scale(0.42) translate(-16 -16)">
    <polygon points="16,2 16,16 2,16"  fill="#d62246"/>
    <polygon points="16,2 30,16 16,16" fill="#2e6bd6"/>
    <polygon points="2,16 16,16 16,30" fill="#9b3fd1"/>
    <polygon points="30,16 16,30 16,16" fill="#1eae54"/>
    <polygon points="16,2 30,16 16,30 2,16" fill="none" stroke="#1a1a26" stroke-width="2.6" stroke-linejoin="round"/>
  </g>

  <!-- diamonds gem (top-right) -->
  <g transform="translate(21.5 11) scale(1.05) translate(-23 -9.3)">
    <polygon points="23,3.6 29,9.3 23,15 17,9.3" fill="#def7ff"/>
    <polygon points="17,9.3 29,9.3 23,15" fill="#c4ecfc"/>
    <polygon points="23,3.6 29,9.3 17,9.3" fill="#eefbff"/>
    <polygon points="23,3.6 26,7.6 20,7.6" fill="#ffffff"/>
    <path d="M17,9.3 H29 M23,3.6 V15" stroke="#a6dbf1" stroke-width="0.5" fill="none"/>
    <polygon points="23,3.6 29,9.3 23,15 17,9.3" fill="none" stroke="#3f9fda" stroke-width="1.0" stroke-linejoin="round"/>
  </g>
</svg>
