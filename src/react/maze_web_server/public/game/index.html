<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze 3D</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    #game-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 1rem;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #ac99ea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #play-again {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 24px;
      font-family: sans-serif;
      font-size: 1rem;
      color: #fff;
      /* Deliberately not #ac99ea — that's the D-pad / spinner accent, and the
         button would visually merge into the D-pad on touch devices. */
      background: #2f9e44;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    /* Bottom banner shown over an *unseeded* preview (an unsaved game
       definition launched from the editor). Informs that the previewed layout
       is indicative — a saved game regenerates from a fresh seed. */
    #preview-banner {
      /* An in-flow strip at the end of the body flex column, so it sits BELOW
         the D-pad controls (rather than overlaying them). Full-width and
         left-aligned with minimal side padding, so on a narrow screen the text
         uses the whole width instead of bunching into a tall centred block. */
      flex: 0 0 auto;
      padding: 8px 10px;
      font-family: sans-serif;
      font-size: 0.9rem;
      line-height: 1.3;
      text-align: left;
      color: #111;
      background: #ffff00;
      border-top: 1px solid rgba(0, 0, 0, 0.3);
    }
    #controls { display: none; }
    .game-dpad { display: none; }
    /* Persistent in-canvas pause button. Always available on touch
       devices regardless of the D-pad show/hide preference, so the
       player has a discoverable way to reach the pause menu. Hidden on
       pointer-fine devices (mouse / trackpad) where Space on the
       keyboard already covers it. */
    #touch-pause-btn { display: none; }
    /* The Hide/Show D-pad button only makes sense on touch devices
       (where the D-pad exists). Hide it on fine-pointer devices so the
       pause menu collapses to just Resume + Restart. */
    #pm-dpad-toggle { display: none; }

    @media (pointer: coarse) {
      #pm-dpad-toggle { display: block; }
      #controls {
        display: flex;
        justify-content: center;
        background: #111;
        padding: 16px 8px 8px;
      }
      .game-dpad {
        display: grid;
        grid-template-areas: "tiltdown up tiltup" "left . right";
        gap: 4px;
        touch-action: none;
      }
      .game-dpad button {
        background: #ac99ea;
        border: none;
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .game-dpad button img {
        display: block;
        pointer-events: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .game-dpad button.tilt {
        opacity: 0.7;
        width: 42px;
        height: 42px;
        align-self: center;
        justify-self: center;
      }
      .game-dpad button.tilt img {
        width: 24px;
        height: 24px;
      }
      /* On touch devices the D-pad occupies the bottom strip — move the
         Play Again button to the top so it doesn't overlap the controls.
         Sits centred at top so the persistent pause button at the
         top-right doesn't collide with it. */
      #play-again {
        top: 16px;
        bottom: auto;
      }
      /* When the user has hidden the D-pad via the pause menu, the
         #controls strip collapses and #play-again returns to the bottom
         where it sits on desktop. */
      body.dpad-hidden #controls { display: none; }
      body.dpad-hidden #play-again { top: auto; bottom: 24px; }
      /* Bottom-right corner of #game-wrap, which sits ABOVE the D-pad
         strip in the flex column. Bottom-right is clear regardless of
         D-pad visibility, sits well clear of the Bevy HUD elements
         (status bar top-left, clock top-centre, minimap top-right),
         and falls naturally under a right-hand thumb. */
      #touch-pause-btn {
        display: flex;
        position: absolute;
        bottom: 12px;
        right: 12px;
        z-index: 20;
        width: 44px;
        height: 44px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.6);
        cursor: pointer;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #touch-pause-btn img {
        width: 24px;
        height: 24px;
        display: block;
        pointer-events: none;
      }
    }

    /* Fatal-error banner. The loading panel is removed once the game
       starts, so a crash mid-play has nothing to write into — this is
       the standalone overlay used from that point on. Centred over the
       canvas and above every other overlay, since the run is over. */
    #fatal-error {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      max-width: min(90vw, 420px);
      padding: 16px 20px;
      font-family: sans-serif;
      font-size: 1rem;
      line-height: 1.4;
      text-align: center;
      color: #ff7070;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ff7070;
      border-radius: 12px;
    }

    /* Shown once the game has been torn down and its memory released —
       navigating away does that, and the page may later be restored from
       the back-forward cache. Without it the restored page shows the
       canvas frozen on its last frame, which reads as a hung game. Not
       styled as an error: ending a run is ordinary, not a fault. */
    #game-ended,
    #run-stopped {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px 32px;
      font-family: sans-serif;
      color: #fff;
      background: #000;
      border: 2px solid #ffff00;
      border-radius: 12px;
    }
    #game-ended h1,
    #run-stopped h1 {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: #ffff00;
    }
    /* Same shape as the ended panel, in the fatal-error red — a run cut short by
       the browser is a fault, not an ordinary ending. */
    #run-stopped { border-color: #ff7070; }
    #run-stopped h1 { color: #ff7070; }
    #run-stopped p {
      max-width: 34ch;
      text-align: center;
      line-height: 1.4;
    }
    #game-ended button,
    #run-stopped button {
      min-width: 200px;
      min-height: 56px;
      padding: 14px 20px;
      font-size: 1rem;
      font-family: inherit;
      color: #fff;
      background: #2f9e44;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    /* The canvas holds a stale frame and everything else here drives a game
       that no longer exists — hide the lot so only the panel remains, including
       a pause menu left open when the player navigated away. */
    body.game-ended canvas,
    body.game-ended #controls,
    body.game-ended #touch-pause-btn,
    body.game-ended #play-again,
    body.game-ended #pause-menu,
    body.run-stopped canvas,
    body.run-stopped #controls,
    body.run-stopped #touch-pause-btn,
    body.run-stopped #pause-menu { display: none; }

    /* In-game pause menu — a host-side HTML overlay shown when Bevy
       reports paused=true via the maze-game-paused CustomEvent. Lives
       outside the canvas so taps don't fall through to the Bevy
       keyboard-input emulator. */
    #pause-menu {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 20px 24px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ac99ea;
      border-radius: 12px;
      font-family: sans-serif;
    }
    #pause-menu[hidden] { display: none; }
    #pause-menu button {
      min-width: 220px;
      min-height: 72px;
      padding: 18px 20px;
      font-size: 1rem;
      color: #fff;
      background: #2f9e44;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }
    #pause-menu button.secondary { background: #495057; }
    /* The menu shows one "view" at a time: the main button list, or the
       Restart confirmation (a deliberate second tap, so a single mis-tap on
       touch can't reset the game). Both stack like the original menu. */
    #pm-main, #pm-confirm { display: flex; flex-direction: column; gap: 24px; }
    #pm-main[hidden], #pm-confirm[hidden] { display: none; }
    #pm-confirm p { margin: 0; color: #fff; text-align: center; font-family: inherit; }
  </style>
</head>
<body>
  <script>
    /* Apply the persisted D-pad-hidden body class as early as possible
       to avoid a flash of visible D-pad on touch devices when the
       preference is "hidden". Runs before #controls is parsed below, so
       the browser sees `display: none` on its first style resolution. */
    (function () {
      try {
        if (localStorage.getItem('dpadHidden') === '1') {
          document.body.classList.add('dpad-hidden');
        }
      } catch (_) { /* localStorage unavailable — ignore */ }
    })();
  </script>
  <div id="game-wrap">
    <!-- tabindex="-1" makes the canvas focusable via script/mouse but
         not via Tab key, so the existing `canvas.focus()` calls
         actually take effect (canvas elements aren't focusable by
         default). Necessary so keyboard input keeps reaching Bevy
         after the player taps a pause-menu button or after a
         Restart-triggered reload. -->
    <canvas id="bevy-canvas" tabindex="-1"></canvas>
    <button type="button" tabindex="-1" id="touch-pause-btn" aria-label="Pause">
      <img src="/images/maze/dpad_pause.png" alt="" draggable="false">
    </button>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading game… (<span id="elapsed">0s</span>)</p>
    </div>
  </div>
  <div id="controls">
    <div class="game-dpad" aria-label="D-pad">
      <button type="button" tabindex="-1" class="tilt" style="grid-area:tiltup"   aria-label="Tilt up">
        <img src="/images/maze/tilt_up.png"    alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" style="grid-area:up"    aria-label="Move forward">
        <img src="/images/maze/dpad_up.png"    alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" style="grid-area:left"  aria-label="Turn left">
        <img src="/images/maze/dpad_left.png"  alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" style="grid-area:right" aria-label="Turn right">
        <img src="/images/maze/dpad_right.png" alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" class="tilt" style="grid-area:tiltdown" aria-label="Tilt down">
        <img src="/images/maze/tilt_down.png"  alt="" draggable="false">
      </button>
    </div>
  </div>
  <div id="pause-menu" hidden role="dialog" aria-label="Paused" aria-modal="true">
    <div id="pm-main">
      <button id="pm-resume" type="button">Resume</button>
      <button id="pm-restart" type="button" class="secondary">Restart</button>
      <button id="pm-dpad-toggle" type="button" class="secondary">Hide D-pad</button>
    </div>
    <div id="pm-confirm" hidden>
      <p>Restart from the beginning?</p>
      <button id="pm-restart-confirm" type="button">Restart</button>
      <button id="pm-restart-cancel" type="button" class="secondary">Cancel</button>
    </div>
  </div>
  <script>
    (function() {
      var auth = JSON.parse(sessionStorage.getItem('auth') ?? 'null');
      var token = auth && auth.token;
      if (!token) token = new URLSearchParams(location.search).get('t');
      if (!token) { location.replace('/'); }
    })();
  </script>
  <script>
    /* Host bridge + failure capture. Deliberately a plain script placed
       before the module below: the module uses top-level await and may
       never run at all if the WASM fetch or instantiation fails, and
       these handlers have to be listening before that can happen. */

    // Forwards one payload to the native host. Each platform exposes a
    // different channel; a plain browser tab (React) has none, so this is
    // a no-op there and the page's own UI carries the information.
    //
    // The Android channel is still named `onGameResult` — it is the
    // channel, not the message type, and renaming it means changing the
    // JavascriptInterface export on the C# side too.
    function postToHost(payload) {
      try {
        var json = JSON.stringify(payload);
        if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
          window.chrome.webview.postMessage(json);                       // Windows WebView2
        } else if (window.MazeMauiHost && window.MazeMauiHost.onGameResult) {
          window.MazeMauiHost.onGameResult(json);                        // Android JavascriptInterface
        } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.MazeMauiHost) {
          window.webkit.messageHandlers.MazeMauiHost.postMessage(json);  // iOS / MacCatalyst WKWebView
        }
      } catch (err) {
        console.error('[host-bridge] forward failed', err);
      }
    }

    // Shows a fatal message to the player. Writes into the loading panel
    // while it still exists (a failure to start), and otherwise builds a
    // standalone overlay — the loading panel is removed once the game
    // starts, so a crash mid-play would otherwise leave a frozen canvas
    // and no explanation.
    function showFatalError(message) {
      var loading = document.getElementById('loading');
      if (loading) {
        var spinner = loading.querySelector('.spinner');
        if (spinner) spinner.remove();
        var p = loading.querySelector('p') || loading.appendChild(document.createElement('p'));
        p.textContent = message;
        p.style.color = '#ff7070';
        return;
      }
      if (document.getElementById('fatal-error')) return;
      var el = document.createElement('div');
      el.id = 'fatal-error';
      el.setAttribute('role', 'alert');
      el.textContent = message;
      document.body.appendChild(el);
    }

    // Replaces the game with an end-of-session panel. Called alongside the
    // teardown rather than after it: the DOM change has to be made *before* the
    // document is frozen into the back-forward cache, so a page restored later
    // shows this instead of a canvas stuck on its final frame. Waiting for the
    // game's own teardown confirmation would be too late — a frozen document
    // does not process events until it is restored.
    function showGameEnded() {
      if (document.getElementById('game-ended')) return;
      // A stopped run never started one, so there is no session to have ended.
      // Leaving this to run would stack the two panels: navigating away from the
      // stopped page fires `pagehide`, which adds this panel before the document
      // is frozen, and returning through the back-forward cache restores both.
      if (document.getElementById('run-stopped')) return;
      document.body.classList.add('game-ended');
      var panel = document.createElement('div');
      panel.id = 'game-ended';
      panel.setAttribute('role', 'status');
      var heading = document.createElement('h1');
      heading.textContent = 'GAME ENDED';
      var again = document.createElement('button');
      again.type = 'button';
      again.textContent = '↻ Play Again';
      // Same query string, so the same maze or definition is replayed.
      again.addEventListener('click', function () { location.reload(); });
      panel.appendChild(heading);
      panel.appendChild(again);
      document.body.appendChild(panel);
    }

    // Records that a run is under way, so a run that ends without the page ever
    // being left can be recognised on the *next* load.
    //
    // When the browser kills this page's process no JavaScript runs — the panic
    // hook, `window.onerror` and the bridge all die with it — and the browser
    // then reloads the page, which would start the same game again, and again.
    // `pagehide` fires for every ordinary way of leaving a page (navigation,
    // reload, freezing into the back-forward cache) and does *not* fire for a
    // kill, so a sentinel that outlives a load is the one signal available.
    var RUN_SENTINEL_KEY = 'mazeRunActive';

    function markRunStarted(subject) {
      try { sessionStorage.setItem(RUN_SENTINEL_KEY, subject); } catch { /* storage disabled */ }
    }

    function clearRunSentinel() {
      try { sessionStorage.removeItem(RUN_SENTINEL_KEY); } catch { /* storage disabled */ }
    }

    // The subject of a run that was under way when this tab last stopped, or
    // `null` if the last page left cleanly (or there was none).
    function abandonedRun() {
      try { return sessionStorage.getItem(RUN_SENTINEL_KEY); } catch { return null; }
    }

    // Shown in place of the game after a killed run, instead of starting it
    // again. Retrying is offered but never automatic: a game that dies reliably
    // would otherwise restart for as long as the player watched it.
    function showRunStopped() {
      if (document.getElementById('run-stopped')) return;
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
      document.body.classList.add('run-stopped');
      var panel = document.createElement('div');
      panel.id = 'run-stopped';
      panel.setAttribute('role', 'alert');
      var heading = document.createElement('h1');
      heading.textContent = 'GAME STOPPED';
      var message = document.createElement('p');
      message.textContent =
        'The game stopped unexpectedly and the browser reloaded this page. '
        + 'It has not been restarted. A game with fewer levels or a smaller maze may run better.';
      var again = document.createElement('button');
      again.type = 'button';
      again.textContent = '↻ Try Again';
      again.addEventListener('click', function () { location.reload(); });
      panel.appendChild(heading);
      panel.appendChild(message);
      panel.appendChild(again);
      document.body.appendChild(panel);
    }

    // Checked here, in the document's own script, rather than in the module
    // below: that module does not run until the WASM has been fetched and
    // compiled, so a check there leaves the player watching "Loading game…"
    // through a download that is about to be thrown away. Cleared as it is read,
    // so an ordinary reload — or the retry offered by the panel — starts a game
    // instead of reporting this stop a second time.
    var mazeRunAbandoned = abandonedRun() !== null;
    if (mazeRunAbandoned) {
      clearRunSentinel();
      showRunStopped();
    }

    (function () {
      // Substrings that mark a failure as an exhausted-memory one rather
      // than an ordinary bug. Matched case-insensitively against the whole
      // error text. `RangeError` earns its place here because that is what
      // a failed WebAssembly.Memory growth surfaces as in practice.
      var OUT_OF_MEMORY_SIGNATURES = [
        'out of memory',
        'oom',
        'memory.grow',
        'allocation failed',
        'allocation size overflow',
        'rangeerror',
        'array buffer allocation failed',
      ];

      var OUT_OF_MEMORY_REASON =
        'The game ran out of memory. Try a game with fewer levels or a smaller maze.';
      var GENERIC_REASON = 'The game stopped unexpectedly.';

      // Whether this run has already reported. A Rust panic leaves Bevy's
      // requestAnimationFrame loop running over a poisoned app, which can
      // throw again every frame; without this the bridge is flooded and the
      // first — real — cause is buried.
      var reported = false;

      function classifyFailure(text) {
        var haystack = String(text || '').toLowerCase();
        for (var i = 0; i < OUT_OF_MEMORY_SIGNATURES.length; i++) {
          if (haystack.indexOf(OUT_OF_MEMORY_SIGNATURES[i]) !== -1) {
            return OUT_OF_MEMORY_REASON;
          }
        }
        return GENERIC_REASON;
      }

      function reportFailure(detail) {
        if (reported) return;
        reported = true;
        // Read the phase before touching the DOM: the loading panel is
        // present only until the game starts, so its presence is what
        // distinguishes a failure to start from a crash during play.
        var phase = document.getElementById('loading') ? 'load' : 'play';
        var reason = classifyFailure(detail);
        showFatalError(reason);
        postToHost({ kind: 'failure', reason: reason, detail: String(detail || ''), phase: phase });
      }

      // A Rust panic, forwarded by the WASM module's panic hook. Carries a
      // real message and source location, so it is the most useful of the
      // three sources — the other two see only what the browser reports.
      window.addEventListener('maze-game-panic', function (e) {
        var d = (e && e.detail) || {};
        reportFailure(d.message ? d.message + ' (' + d.location + ')' : 'panic');
      });

      // Uncaught errors, including anything thrown out of Bevy's animation
      // frame callback once the game is running.
      window.addEventListener('error', function (e) {
        reportFailure((e && (e.message || (e.error && e.error.message))) || 'error');
      });

      // The module script's top-level await chain rejects here — a failed
      // WASM fetch, a failed instantiation, or a failed maze/definition load.
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        reportFailure((r && (r.message || r)) || 'unhandled rejection');
      });
    })();
  </script>
  <script>
    window.addEventListener('maze-game-result', function (e) {
      // Forward the result to the MAUI platform bridge so the native host can
      // capture it. Tagged `kind: "result"` so the host can tell it from the
      // failure payloads that share this channel; a host predating the envelope
      // ignores the extra field and still reads it as a result.
      postToHost(Object.assign({ kind: 'result' }, e.detail));

      // Record the run on the server when the player won. Fire-and-forget so a
      // failed submit never blocks the Play Again affordance below.
      submitScoreOnWin(e.detail);

      // Offer a "Play Again" affordance — reloads /game/ with the same query
      // string (?id / ?def preserved). Works in both the React browser tab and
      // the MAUI WebView.
      showPlayAgain();
    });

    // The game has finished tearing down and released its memory. Forwarded so a
    // native host can wait for the release before destroying the document,
    // rather than guessing at a delay.
    window.addEventListener('maze-game-stopped', function () {
      postToHost({ kind: 'stopped' });
      // Logged unconditionally, like the load timings above — the only visible
      // confirmation that the teardown ran. Read on the next task rather than
      // inline: the event is dispatched from *within* the drop, so a figure
      // taken now would be mid-release.
      setTimeout(function () {
        // Via the window handle rather than the module's `live_bytes` import:
        // this listener lives in a plain script, which has no access to module
        // scope. The figure is therefore only available on a diagnostics launch,
        // which is the only time anyone is reading it.
        var live = window.__mazeLiveBytes
          ? (window.__mazeLiveBytes() / (1024 * 1024)).toFixed(1) + ' MB'
          : 'n/a (launch with ?mem=1 for the figure)';
        console.log('[game] stopped — live ' + live);
      }, 0);
    });

    // Records a won 3D run against the server leaderboard. Only wins are
    // recorded (no loss/quit). The subject is the user maze (?id) when present,
    // or a stored game definition's server-computed challengeKey (?def, published
    // definitions only). Runs with no stable subject (the demo / no-config path,
    // or an unpublished definition preview) are not recorded. Server-owned fields
    // (the player and the record timestamp) are set by the endpoint, never sent
    // from here.
    function submitScoreOnWin(detail) {
      if (!detail || detail.outcome !== 'win') return;

      var params = new URLSearchParams(location.search);
      var auth = JSON.parse(sessionStorage.getItem('auth') ?? 'null');
      var token = (auth && auth.token) || params.get('t');
      if (!token) return;

      var body = { score: detail.score, elapsed_ms: detail.elapsedMs };
      var mazeId = params.get('id');
      if (params.get('def')) {
        // Stored game definition. The subject is the server-computed challengeKey,
        // stashed on window by the definition loader after its fetch. It is only
        // set for a published (leaderboard-tracked) definition, so its absence
        // means an unpublished preview run — don't record.
        if (!window.__mazeDefChallenge) return;
        body.challenge = window.__mazeDefChallenge;
      } else if (mazeId) {
        body.maze_id = mazeId;
      } else {
        return; // no stable subject — nothing to record
      }

      fetch('/api/v1/scores', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify(body),
      }).catch(function (err) {
        console.error('[score] submit failed', err);
      });
    }

    function showPlayAgain() {
      if (document.getElementById('play-again')) return;
      var btn = document.createElement('button');
      btn.id = 'play-again';
      btn.type = 'button';
      btn.textContent = '↻ Play Again';
      btn.addEventListener('click', function () { location.reload(); });
      document.body.appendChild(btn);
    }

    // Banner shown for any preview run — scores are never recorded. For an
    // unseeded (unsaved) game it also notes the layout is indicative, since
    // saving mints a fresh seed and regenerates it.
    function showPreviewBanner(seeded) {
      if (document.getElementById('preview-banner')) return;
      var el = document.createElement('div');
      el.id = 'preview-banner';
      el.setAttribute('role', 'status');
      el.textContent = seeded
        ? 'Preview only — score will not be saved.'
        : 'Preview only — score will not be saved. When you save this game its'
          + ' layout will be generated from a new seed, so the saved game will'
          + ' look different from this.';
      document.body.appendChild(el);
    }
  </script>
  <script>
    /* Pause-menu wiring — opens on Bevy's `maze-game-paused` event,
       offers Resume / Restart / D-pad-toggle controls suitable for
       touch use. Synthesises a Space keydown/keyup on the canvas to
       toggle Bevy's pause state, matching the corner pause button.
       Lives in a vanilla script so it survives WASM load
       failures (the module script below uses top-level await and may
       throw if the WASM fetch fails). */
    (function () {
      var menu = document.getElementById('pause-menu');
      var resume = document.getElementById('pm-resume');
      var restart = document.getElementById('pm-restart');
      var dpadToggle = document.getElementById('pm-dpad-toggle');
      var mainView = document.getElementById('pm-main');
      var confirmView = document.getElementById('pm-confirm');
      var restartConfirm = document.getElementById('pm-restart-confirm');
      var restartCancel = document.getElementById('pm-restart-cancel');
      var canvas = document.getElementById('bevy-canvas');

      function showMainView() {
        confirmView.hidden = true;
        mainView.hidden = false;
      }
      // The persistent corner button (#touch-pause-btn, always visible on
      // touch devices) is the only on-screen pause control — deliberately
      // off the D-pad so it can't be hit mid-move. Kept as an array so the
      // pointer wiring and the paused-state icon/label swap below stay generic.
      var pauseButtonIds = ['touch-pause-btn'];

      function fire(key, type) {
        canvas.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true }));
      }

      function firePause() {
        fire('Space', 'keydown');
        fire('Space', 'keyup');
      }

      function refreshDpadLabel() {
        dpadToggle.textContent = document.body.classList.contains('dpad-hidden')
          ? 'Show D-pad'
          : 'Hide D-pad';
      }
      refreshDpadLabel();

      for (var i = 0; i < pauseButtonIds.length; i++) {
        var btn = document.getElementById(pauseButtonIds[i]);
        if (!btn) continue;
        btn.addEventListener('pointerdown',   function (e) { e.preventDefault(); fire('Space', 'keydown'); });
        btn.addEventListener('pointerup',     function (e) { e.preventDefault(); fire('Space', 'keyup');   });
        btn.addEventListener('pointerleave',  function ()  { fire('Space', 'keyup'); });
        btn.addEventListener('pointercancel', function ()  { fire('Space', 'keyup'); });
        btn.addEventListener('contextmenu',   function (e) { e.preventDefault(); });
      }

      window.addEventListener('maze-game-paused', function (e) {
        var paused = !!(e.detail && e.detail.paused);
        if (paused) {
          refreshDpadLabel();
          showMainView(); // always reopen on the main list, never a stale confirm
          menu.hidden = false;
        } else {
          menu.hidden = true;
        }
        for (var i = 0; i < pauseButtonIds.length; i++) {
          var btn = document.getElementById(pauseButtonIds[i]);
          if (!btn) continue;
          var img = btn.querySelector('img');
          if (img) img.src = paused ? '/images/maze/dpad_play.png' : '/images/maze/dpad_pause.png';
          btn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
        }
      });

      resume.addEventListener('click', function () {
        // Same code path as the corner pause button — Bevy
        // toggles paused=false, the `maze-game-paused` listener above
        // then hides the menu. Re-focus the canvas so subsequent
        // keyboard input goes to Bevy rather than the (now hidden)
        // Resume button.
        firePause();
        canvas.focus({ preventScroll: true });
      });

      restart.addEventListener('click', function () {
        // Don't restart on the first tap — show an in-overlay confirmation so
        // a stray tap (easy on touch) can't reset the game. Default focus to
        // Cancel, the safe choice.
        mainView.hidden = true;
        confirmView.hidden = false;
        restartCancel.focus({ preventScroll: true });
      });

      restartConfirm.addEventListener('click', function () {
        // Preserves the current query string (?id / ?def / ?preview)
        // for parity with the post-game "Play Again" button.
        location.reload();
      });

      restartCancel.addEventListener('click', showMainView);

      dpadToggle.addEventListener('click', function () {
        var hidden = document.body.classList.toggle('dpad-hidden');
        try {
          localStorage.setItem('dpadHidden', hidden ? '1' : '0');
        } catch (_) { /* localStorage unavailable — ignore */ }
        refreshDpadLabel();
      });
    })();
  </script>
  <script type="module">
    import { start, start_with_config, stop, live_bytes, default as init } from './maze_game_bevy_wasm.js';

    const WASM_URL = './maze_game_bevy_wasm_bg.wasm?v=165';

    let secs = 0;
    const timer = setInterval(() => {
      // The loading panel may already have been replaced — by the stopped panel,
      // or by the game starting — and a tick into a missing element would raise
      // an error the failure handlers would report as a crash.
      const elapsed = document.getElementById('elapsed');
      if (elapsed) elapsed.textContent = `${++secs}s`;
    }, 1000);

    // Load-time errors the page detects itself (a missing subject, a failed
    // fetch) — as opposed to the crashes the failure handlers catch. Both
    // render through the same overlay so a stopped game looks the same however
    // it stopped.
    function showLoadingError(message) {
      clearInterval(timer);
      showFatalError(message);
    }

    // Top row of a subject's leaderboard for one metric. `score` sorts
    // highest-first, `time` fastest-first, so the first row is that metric's
    // record. Returns the row, or null for an empty board; throws on a failed
    // fetch so the caller can fall back to "un-tracked" (no banner).
    async function fetchTopRow(subjectQuery, metric, token) {
      const res = await fetch(`/api/v1/scores?${subjectQuery}&metric=${metric}&limit=1`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`scores ${metric} ${res.status}`);
      const board = await res.json();
      return (board.scores && board.scores.length > 0) ? board.scores[0] : null;
    }

    // Writes the win-banner record thresholds onto a start config (mutates +
    // returns it). The game shows "High Score" / "Fastest Time" banners on a win
    // that beats the board top score / fastest time for this subject — fetched
    // here at launch. `leaderboardTracked` is set whenever the run will submit a
    // score (subject + token); the two thresholds are left undefined (dropped by
    // JSON.stringify) for an empty board — which the Bevy side reads as "the first
    // run is a record" — or for an un-tracked run, which shows no banner.
    // `subjectQuery` is `maze_id=…` or `challenge=…`.
    async function applyRecordThresholds(config, subjectQuery, token) {
      if (token) {
        try {
          const [scoreRow, timeRow] = await Promise.all([
            fetchTopRow(subjectQuery, 'score', token),
            fetchTopRow(subjectQuery, 'time', token),
          ]);
          config.leaderboardTracked = true;
          config.highScoreToBeat = scoreRow ? scoreRow.score : undefined;
          config.fastestTimeToBeat = timeRow ? timeRow.elapsed_ms : undefined;
          return config;
        } catch (_) { /* fall through to un-tracked */ }
      }
      config.leaderboardTracked = false;
      return config;
    }

    // Skipped entirely for a run the page has already reported as stopped: the
    // binary is the slowest thing this page does, and no game is going to run.
    if (!mazeRunAbandoned) {
      const t0 = performance.now();
      const response = await fetch(WASM_URL);
      const t1 = performance.now();
      console.log(`[game] fetch: ${((t1 - t0) / 1000).toFixed(2)}s`);
      await init({ module_or_path: response });
      const t2 = performance.now();
      console.log(`[game] compile+init: ${((t2 - t1) / 1000).toFixed(2)}s`);
      console.log(`[game] total: ${((t2 - t0) / 1000).toFixed(2)}s`);
    }

    const canvas = document.getElementById('bevy-canvas');
    const params = new URLSearchParams(location.search);
    const mazeId = params.get('id');
    const defId = params.get('def');
    const isPreview = params.get('preview');
    // `?mem=1` turns on the in-game developer diagnostics readout (memory,
    // entity counts, frame rate). Applies to every launch branch below, so a
    // run can be measured however it was started.
    const debugMemory = params.get('mem') === '1';

    // `?res=<fraction>` and `?msaa=<samples>` are developer knobs for finding
    // where a frame's time goes on a device. `res` is a fraction of the device's
    // own pixel ratio — `0.5` renders at half linear resolution, a quarter of
    // the pixels — resolved here rather than in Bevy because the browser is what
    // knows the ratio. `msaa` is a sample count, `0`/`1` for off. Absent, the
    // game renders exactly as it always has.
    const renderFraction = Number(params.get('res'));
    const renderScale = params.has('res') && renderFraction > 0
      ? (window.devicePixelRatio || 1) * renderFraction
      : undefined;
    const msaaValue = Number(params.get('msaa'));
    const msaaSamples = params.has('msaa') && Number.isInteger(msaaValue) ? msaaValue : undefined;

    // `?floors=<below>,<above>` bounds how much of a multi-level stack is drawn
    // and animated, counted from the player's own floor — `0,0` is that floor
    // alone. Absent, every level is drawn, as always. A stack costs its whole
    // height on every frame otherwise, however little of it can be seen.
    // `?orb=0` leaves the finish orb unspawned. It is the game's only
    // shadow-casting light — a point light's shadow is a cube map, so six extra
    // scene passes — and only the final level has one, which makes that level
    // structurally dearer than the rest.
    const hideFinishOrb = params.get('orb') === '0';
    // `?shadows=0` keeps the orb but stops its light casting — six scene passes
    // fewer, with the finish still marked.
    const disableOrbShadows = params.get('shadows') === '0';
    // `?light=0` goes further: the orb keeps its own glow (its material is
    // emissive) but lights nothing around it, so there is no shadow to cast.
    const disableOrbLight = params.get('light') === '0';
    // `?wall_animation=0` stills the water / lava pool wave; `?glow=0` drops the
    // point light every key holder and treasure carries. Both are per-frame
    // costs a maze pays in proportion to how much of that content it holds.
    const freezeWallAnimation = params.get('wall_animation') === '0';
    const disableObjectGlow = params.get('glow') === '0';
    // `?ladders=0` resolves interim finishes to portals. A ladder climbing into a
    // floor the window is hiding reads as rising into nothing; a portal that
    // transports you elsewhere does not need the destination to be visible.
    const allowLadders = params.get('ladders') !== '0';
    // Whether this looks like a phone or a tablet.
    //
    // Unlike the MAUI app, which knows its own platform for a fact, a browser has
    // to judge. `(pointer: coarse)` is the primary signal because it describes
    // the *primary* input: a touch laptop driven by a mouse reports `fine` and is
    // correctly left alone. iPadOS is the awkward case — Safari there presents
    // itself as desktop Safari on a Mac, so a `MacIntel` platform reporting more
    // than one touch point is an iPad rather than a desktop.
    function looksLikeAMobileDevice() {
      const touchPoints = navigator.maxTouchPoints ?? 0;
      const iPadInDesktopClothing = navigator.platform === 'MacIntel' && touchPoints > 1;
      const coarsePointer = window.matchMedia?.('(pointer: coarse)').matches ?? false;
      return iPadInDesktopClothing || (coarsePointer && touchPoints > 0);
    }

    // `?mobile_mode=1` is the one a phone wants: it turns on the settings that
    // measured worth having on a device, so the individual switches above stay
    // diagnostics rather than something a caller has to assemble by hand.
    //
    // Absent, the page decides for itself. An explicit value always wins, so
    // `?mobile_mode=0` is how you measure a phone *without* it — and the MAUI
    // app, which appends the parameter on iOS and Android, is never second-
    // guessed by a detection it does not need.
    const mobileModeParam = params.get('mobile_mode');
    const mobileMode =
      mobileModeParam !== null ? mobileModeParam === '1' : looksLikeAMobileDevice();

    const pair = (name) => {
      const parts = (params.get(name) ?? '').split(',').map(Number);
      return parts.length === 2 && parts.every(Number.isInteger) && parts.every(n => n >= 0)
        ? parts
        : undefined;
    };
    const floors = pair('floors');
    const lightsAll = params.get('lights') === 'all';
    const lights = pair('lights');

    // Applied to every launch branch, so a run can be measured however it was
    // started. Each override is only sent when asked for, leaving an ordinary
    // launch's payload byte-identical to what it was before these existed.
    function applyDebugOverrides(startConfig) {
      startConfig.debugMemory = debugMemory;
      if (renderScale !== undefined) startConfig.renderScale = renderScale;
      if (msaaSamples !== undefined) startConfig.msaaSamples = msaaSamples;
      if (hideFinishOrb) startConfig.hideFinishOrb = true;
      if (disableOrbShadows) startConfig.disableOrbShadows = true;
      if (disableOrbLight) startConfig.disableOrbLight = true;
      if (freezeWallAnimation) startConfig.freezeWallAnimation = true;
      if (disableObjectGlow) startConfig.disableObjectGlow = true;
      if (!allowLadders) startConfig.allowLadders = false;
      if (mobileMode) startConfig.mobileMode = true;
      if (floors || lights || lightsAll) {
        startConfig.levels = {
          ...(startConfig.levels ?? {}),
          ...(floors ? { visibleBelow: floors[0], visibleAbove: floors[1] } : {}),
          ...(lights ? { lightsBelow: lights[0], lightsAbove: lights[1] } : {}),
          // Explicit nulls, not omission: the field defaults to the player's own
          // floor, so leaving it out would keep the narrow range rather than
          // widen it.
          ...(lightsAll ? { lightsBelow: null, lightsAbove: null } : {}),
        };
      }
      return startConfig;
    }

    // Starts the game, recording that a run is under way for as long as it is.
    // The sentinel goes down *before* the call: from this point the document can
    // be killed at any moment, and a run that had not yet written the flag would
    // be silently restarted on the reload that follows. A synchronous failure to
    // start clears it again — that run never lived, and the player has already
    // been told why. `subject` identifies which launch died.
    // Returns whether the game started.
    function startGame(startConfig, subject) {
      markRunStarted(subject);
      try {
        start_with_config(JSON.stringify(startConfig));
        document.getElementById('loading').remove();
        canvas.focus({ preventScroll: true });
        return true;
      } catch (err) {
        clearRunSentinel();
        showLoadingError(`Failed to start game: ${err}`);
        return false;
      }
    }

    // Teardown API, exposed unconditionally: this is how a native host releases
    // the game before navigating away, not a debug aid. The stop is honoured on
    // the game's next frame, so a caller that needs it to have happened must
    // give it one.
    window.__mazeStop = stop;

    // Best effort on the way out. The document is about to be destroyed and the
    // app may get no frame to act on, so this is a cheap backstop rather than
    // the mechanism — the deliberate wait lives on the native side.
    //
    // Unconditional, including when the page is only being frozen into the
    // back-forward cache: a game we might return to still holds its memory, and
    // the browser reclaims it no sooner than it chooses. The panel goes up first
    // and synchronously, so a document frozen a moment later carries it — a
    // restored page then shows an ended game rather than a stuck one.
    window.addEventListener('pagehide', () => {
      // The page is being left deliberately, so the run did not die — clear the
      // sentinel before anything else, or the next load reports a crash.
      clearRunSentinel();
      showGameEnded();
      try { stop(); } catch { /* module may already be gone */ }
    });

    if (debugMemory) {
      // Diagnostic only. A function rather than a value on purpose: if
      // `__mazeStop` drops the Bevy app, the in-game readout goes with it and
      // cannot report its own funeral, whereas this keeps answering. Read it
      // either side of a stop to see whether the world was actually released —
      // the in-game `mem` row cannot show that, because WebAssembly linear
      // memory only ever grows.
      window.__mazeLiveBytes = live_bytes;
    }
    // localStorage handoff key for an editor preview — mirrors
    // `PREVIEW_STORAGE_KEY` in src/utils/definitionPreview.ts.
    const PREVIEW_STORAGE_KEY = 'gameDefinitionPreview';

    if (mazeRunAbandoned) {
      // Already reported before this module ran; nothing is launched.
      clearInterval(timer);
    } else if (mazeId) {
      // /game/?id=<mazeId> — a specific user-edited maze. The React app
      // writes the maze's effective launch settings to localStorage under
      // MODE_STORAGE_KEY before navigating here; we read them back and build
      // the StartConfig. If no settings are stored (e.g. the user opened
      // /game/?id=… directly via URL), fall back to the same clean-look
      // defaults the settings form uses.
      const MODE_STORAGE_KEY = 'mazeGameSettings';
      // Max maze-name length passed as the in-game status-bar `mode`
      // label. The status bar is a fixed-width container (~140 px at
      // 22 pt font in maze_game_bevy/src/hud/statusbar.rs); 20 chars is
      // a heuristic that fits without overflowing. Longer names are
      // truncated with an ellipsis.
      const MODE_MAX_LENGTH = 20;
      const DEFAULT_LAUNCH_SETTINGS = {
        skyType: 'night',
        wallType: 'brick',
        perimeterWalls: true,
        doorStyle: 'swing',
        keyHolder: 'pedestal',
        enemyType: 'goblin',
        healthStyle: 'heart',
        wallTint: false,
        wallMaterialVariation: false,
        deadEndObjects: true,
        wallDecorations: true,
        floorAccents: true,
        timerSeconds: 60,
      };
      function loadLaunchSettings() {
        // Two channels write the per-launch settings:
        //   - React SPA → localStorage (the React app writes the effective
        //     settings to MODE_STORAGE_KEY before navigating).
        //   - MAUI native popup → URL query params (each WebView has
        //     its own isolated storage, so MAUI can't share the SPA's
        //     localStorage — it serialises the settings into the URL
        //     it asks the WebView to load).
        // URL params win when both are present, so MAUI's explicit
        // per-launch choice always overrides any stale localStorage.
        const base = { ...DEFAULT_LAUNCH_SETTINGS };
        try {
          const raw = localStorage.getItem(MODE_STORAGE_KEY);
          if (raw) Object.assign(base, JSON.parse(raw));
        } catch (_) { /* malformed JSON or storage disabled — ignore */ }
        // Then layer URL params on top, if any.
        const readBool = (key, fallback) => {
          const v = params.get(key);
          if (v === '1' || v === 'true') return true;
          if (v === '0' || v === 'false') return false;
          return fallback;
        };
        const readStr = (key, fallback) => params.get(key) ?? fallback;
        const readPosInt = (key, fallback) => {
          const v = params.get(key);
          if (v === null) return fallback;
          const n = Number(v);
          return Number.isFinite(n) && n > 0 ? n : fallback;
        };
        return {
          skyType: readStr('skyType', base.skyType),
          wallType: readStr('wallType', base.wallType),
          perimeterWalls: readBool('perimeterWalls', base.perimeterWalls),
          doorStyle: readStr('doorStyle', base.doorStyle),
          keyHolder: readStr('keyHolder', base.keyHolder),
          enemyType: readStr('enemyType', base.enemyType),
          healthStyle: readStr('healthStyle', base.healthStyle),
          wallTint: readBool('wallTint', base.wallTint),
          wallMaterialVariation: readBool('wallMaterialVariation', base.wallMaterialVariation),
          deadEndObjects: readBool('deadEndObjects', base.deadEndObjects),
          wallDecorations: readBool('wallDecorations', base.wallDecorations),
          floorAccents: readBool('floorAccents', base.floorAccents),
          timerSeconds: readPosInt('timerSeconds', base.timerSeconds),
        };
      }
      function truncateMode(name) {
        if (typeof name !== 'string') return 'Play';
        const trimmed = name.trim();
        if (trimmed.length === 0) return 'Play';
        return trimmed.length > MODE_MAX_LENGTH
          ? trimmed.slice(0, MODE_MAX_LENGTH - 1) + '…'
          : trimmed;
      }
      const auth = JSON.parse(sessionStorage.getItem('auth') ?? 'null');
      const token = (auth && auth.token) || params.get('t');
      clearInterval(timer);
      document.getElementById('loading').querySelector('p').textContent = 'Loading maze…';
      const res = await fetch(`/api/v1/mazes/${encodeURIComponent(mazeId)}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Failed to load maze');
      const maze = await res.json();
      const settings = loadLaunchSettings();
      const startConfig = {
        timerSeconds: settings.timerSeconds,
        mode: truncateMode(maze.name),
        skyType: settings.skyType,
        wallType: settings.wallType,
        perimeterWalls: settings.perimeterWalls,
        doorStyle: settings.doorStyle,
        keyHolder: settings.keyHolder,
        enemyType: settings.enemyType,
        healthStyle: settings.healthStyle,
        landmarks: {
          wallTint: settings.wallTint,
          wallMaterialVariation: settings.wallMaterialVariation,
          deadEndObjects: settings.deadEndObjects,
          wallDecorations: settings.wallDecorations,
          floorAccents: settings.floorAccents,
        },
        mazeJson: JSON.stringify(maze.definition),
      };
      applyDebugOverrides(startConfig);
      // Win-banner record thresholds for this maze's board (un-tracked → none).
      await applyRecordThresholds(startConfig, `maze_id=${encodeURIComponent(mazeId)}`, token);
      startGame(startConfig, `id=${mazeId}`);
    } else if (defId) {
      // /game/?def=<id> — a stored game definition. The fetch is auth-gated: the
      // server composes access and returns 404 for anything this user can't see.
      // Forward the opaque `config` verbatim as the StartConfig (the server has
      // already spliced in the effective seed), and — for a published,
      // leaderboard-tracked definition — fetch its win-banner record thresholds
      // and stash the server-computed challengeKey for the score submitter.
      const auth = JSON.parse(sessionStorage.getItem('auth') ?? 'null');
      const token = (auth && auth.token) || params.get('t');
      clearInterval(timer);
      document.getElementById('loading').querySelector('p').textContent = 'Loading game…';
      const res = await fetch(`/api/v1/game-definitions/${encodeURIComponent(defId)}`, {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (res.ok) {
        const play = await res.json();
        const startConfig = applyDebugOverrides(play.config);
        if (play.leaderboardTracked) {
          window.__mazeDefChallenge = play.challengeKey;
          await applyRecordThresholds(
            startConfig, `challenge=${encodeURIComponent(play.challengeKey)}`, token);
        } else {
          // Owner preview of an unpublished definition — playable but not tracked.
          startConfig.leaderboardTracked = false;
        }
        startGame(startConfig, `def=${defId}`);
      } else {
        const body = await res.text().catch(() => '');
        showLoadingError(`Failed to load game definition (${res.status}): ${body || res.statusText}`);
      }
    } else if (isPreview) {
      // /game/?preview=1 — a one-off preview of an in-progress (possibly unsaved)
      // definition config from the editor. The React app stashes {config, seeded}
      // in localStorage; we start Bevy from it directly (no fetch, never records a
      // score — there is no stable subject), and show a banner saying so (plus,
      // for an unseeded/unsaved game, that its layout is indicative).
      clearInterval(timer);
      let payload = null;
      try {
        const raw = localStorage.getItem(PREVIEW_STORAGE_KEY);
        if (raw) payload = JSON.parse(raw);
      } catch (_) { /* malformed JSON or storage disabled — ignore */ }
      if (!payload || !payload.config) {
        showLoadingError('No preview to show — launch a preview from the game editor.');
      } else {
        const startConfig = applyDebugOverrides(payload.config);
        startConfig.leaderboardTracked = false;
        if (startGame(startConfig, 'preview')) showPreviewBanner(payload.seeded);
      }
    } else {
      // No ?id / ?def / ?preview — nothing to load. The host page is only
      // reached from the app, which always names a subject.
      showLoadingError('No game specified — open a game from the app.');
    }

    function fire(key, type) {
      canvas.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true }));
    }
    const btnDefs = [
      { label: 'Move forward', key: 'ArrowUp'    },
      { label: 'Turn left',    key: 'ArrowLeft'  },
      { label: 'Turn right',   key: 'ArrowRight' },
      { label: 'Tilt up',      key: 'KeyQ'       },
      { label: 'Tilt down',    key: 'KeyE'       },
    ];
    for (const { label, key } of btnDefs) {
      const btn = document.querySelector(`[aria-label="${label}"]`);
      btn.addEventListener('pointerdown',   e => { e.preventDefault(); fire(key, 'keydown'); });
      btn.addEventListener('pointerup',     e => { e.preventDefault(); fire(key, 'keyup'); });
      btn.addEventListener('pointerleave',  () => fire(key, 'keyup'));
      btn.addEventListener('pointercancel', () => fire(key, 'keyup'));
      btn.addEventListener('contextmenu',   e => e.preventDefault());
    }

    // Pause-button click wiring lives in the vanilla pause-menu script
    // higher up in this file — those listeners need to be attached
    // before WASM loads so the buttons are usable as soon as the canvas
    // appears (and remain testable when the WASM fetch is stubbed out).

    // Canvas touch gestures — translate single-finger gestures to the same
    // synthetic key events the D-pad already uses, so the Bevy side stays
    // keyboard-driven. Swipe left/right → turn; swipe up/down → tilt
    // (one incremental nudge per swipe); press-and-hold with no movement
    // → move forward (held). Multi-touch is ignored to avoid pinch/zoom
    // misfires. The D-pad lives in a separate `#controls` strip below the
    // canvas, so its taps never hit these listeners.
    {
      const SWIPE_THRESHOLD = 30;   // px — minimum travel to classify as a swipe
      const HOLD_DELAY = 250;       // ms — touch must be held this long with no movement to count as a hold
      // ms to hold a synthetic KeyQ / KeyE for a swipe-up / swipe-down
      // tilt. The Bevy side reads Q/E with `pressed()` (continuous), so
      // an instant keydown+keyup (the swipe-left/right turn pattern)
      // gives at most one frame of pitch ≈ 1° — invisible. Holding for
      // ~250 ms at the configured pitch rate gives a clearly-visible
      // ~15° nudge per swipe.
      const TILT_HOLD_MS = 250;
      let touchStart = null;        // { x, y, lastX, lastY }
      let holdTimer = null;
      let holdActive = false;

      const cancelHold = () => {
        if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
        if (holdActive) { fire('ArrowUp', 'keyup'); holdActive = false; }
      };

      canvas.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) {
          cancelHold();
          touchStart = null;
          return;
        }
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY, lastX: t.clientX, lastY: t.clientY };
        holdActive = false;
        holdTimer = setTimeout(() => {
          if (touchStart && !holdActive) {
            holdActive = true;
            fire('ArrowUp', 'keydown');
          }
        }, HOLD_DELAY);
      }, { passive: true });

      canvas.addEventListener('touchmove', e => {
        if (!touchStart || e.touches.length !== 1) return;
        const t = e.touches[0];
        touchStart.lastX = t.clientX;
        touchStart.lastY = t.clientY;
        // Once the touch has moved beyond the swipe threshold, it can no
        // longer promote to a hold — cancel the pending hold timer.
        if (!holdActive && holdTimer !== null) {
          const dx = t.clientX - touchStart.x;
          const dy = t.clientY - touchStart.y;
          if (Math.hypot(dx, dy) > SWIPE_THRESHOLD) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        if (!touchStart) return;
        if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
        if (holdActive) {
          fire('ArrowUp', 'keyup');
          holdActive = false;
        } else {
          const dx = touchStart.lastX - touchStart.x;
          const dy = touchStart.lastY - touchStart.y;
          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          if (Math.max(absX, absY) >= SWIPE_THRESHOLD) {
            if (absX > absY) {
              // Turn: ArrowLeft/Right are read with `just_pressed()` on
              // the Bevy side, so an instant keydown+keyup registers
              // one 90° turn animation.
              const key = dx > 0 ? 'ArrowRight' : 'ArrowLeft';
              fire(key, 'keydown');
              fire(key, 'keyup');
            } else {
              // Tilt: KeyQ/KeyE are read with `pressed()` (continuous
              // hold for proportional pitch). Hold the synthetic key
              // for TILT_HOLD_MS so the pitch accumulator moves a
              // visible amount. Screen y grows downward, so swipe UP
              // (negative dy) = tilt up = KeyQ.
              const key = dy < 0 ? 'KeyQ' : 'KeyE';
              fire(key, 'keydown');
              setTimeout(() => fire(key, 'keyup'), TILT_HOLD_MS);
            }
          }
          // A plain tap (no swipe, no hold) does nothing — keys are
          // auto-collected on walk-over, so there is no pickup gesture.
        }
        touchStart = null;
      }, { passive: true });

      canvas.addEventListener('touchcancel', () => {
        cancelHold();
        touchStart = null;
      }, { passive: true });
    }
  </script>
</body>
</html>
