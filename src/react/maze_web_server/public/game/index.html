<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maze 3D</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }
    #game-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      font-size: 1rem;
      z-index: 10;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #ac99ea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #play-again {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 24px;
      font-family: sans-serif;
      font-size: 1rem;
      color: #fff;
      /* Deliberately not #ac99ea — that's the D-pad / spinner accent, and the
         button would visually merge into the D-pad on touch devices. */
      background: #2f9e44;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #controls { display: none; }
    .game-dpad { display: none; }

    @media (pointer: coarse) {
      #controls {
        display: flex;
        justify-content: center;
        background: #111;
        padding: 16px 8px 8px;
      }
      .game-dpad {
        display: grid;
        grid-template-areas: "tiltdown up tiltup" "left pause right";
        gap: 4px;
        touch-action: none;
      }
      .game-dpad button {
        background: #ac99ea;
        border: none;
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        touch-action: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .game-dpad button img {
        display: block;
        pointer-events: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .game-dpad button.tilt {
        opacity: 0.7;
        width: 42px;
        height: 42px;
        align-self: center;
        justify-self: center;
      }
      .game-dpad button.tilt img {
        width: 24px;
        height: 24px;
      }
      /* On touch devices the D-pad occupies the bottom strip — move the
         Play Again button to the top so it doesn't overlap the controls. */
      #play-again {
        top: 16px;
        bottom: auto;
      }
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="bevy-canvas"></canvas>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading game… (<span id="elapsed">0s</span>)</p>
    </div>
  </div>
  <div id="controls">
    <div class="game-dpad" aria-label="D-pad">
      <button type="button" tabindex="-1" class="tilt" style="grid-area:tiltup"   aria-label="Tilt up">
        <img src="/images/maze/tilt_up.png"    alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" style="grid-area:up"    aria-label="Move forward">
        <img src="/images/maze/dpad_up.png"    alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" style="grid-area:left"  aria-label="Turn left">
        <img src="/images/maze/dpad_left.png"  alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" style="grid-area:right" aria-label="Turn right">
        <img src="/images/maze/dpad_right.png" alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" class="tilt" style="grid-area:tiltdown" aria-label="Tilt down">
        <img src="/images/maze/tilt_down.png"  alt="" draggable="false">
      </button>
      <button type="button" tabindex="-1" id="pause-btn" style="grid-area:pause" aria-label="Pause">
        <img src="/images/maze/dpad_pause.png" alt="" draggable="false">
      </button>
    </div>
  </div>
  <script>
    (function() {
      var auth = JSON.parse(sessionStorage.getItem('auth') ?? 'null');
      var token = auth && auth.token;
      if (!token) token = new URLSearchParams(location.search).get('t');
      if (!token) { location.replace('/'); }
    })();
  </script>
  <script>
    window.addEventListener('maze-game-result', function (e) {
      // Forward the result to the MAUI platform bridge so the native host can
      // capture it. Each platform exposes a different channel; a plain browser
      // tab (React) has none — the CustomEvent itself remains observable.
      try {
        var payload = JSON.stringify(e.detail);
        if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
          window.chrome.webview.postMessage(payload);                       // Windows WebView2
        } else if (window.MazeMauiHost && window.MazeMauiHost.onGameResult) {
          window.MazeMauiHost.onGameResult(payload);                        // Android JavascriptInterface
        } else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.MazeMauiHost) {
          window.webkit.messageHandlers.MazeMauiHost.postMessage(payload);  // iOS / MacCatalyst WKWebView
        }
      } catch (err) {
        console.error('[game-result] bridge forward failed', err);
      }

      // Offer a "Play Again" affordance — reloads /game/ with the same query
      // string (difficulty / seed preserved). Works in both the React browser
      // tab and the MAUI WebView.
      showPlayAgain();
    });

    function showPlayAgain() {
      if (document.getElementById('play-again')) return;
      var btn = document.createElement('button');
      btn.id = 'play-again';
      btn.type = 'button';
      btn.textContent = '↻ Play Again';
      btn.addEventListener('click', function () { location.reload(); });
      document.body.appendChild(btn);
    }
  </script>
  <script type="module">
    import { start, start_with_maze, start_with_config, default as init } from './maze_game_bevy_wasm.js';

    const WASM_URL = './maze_game_bevy_wasm_bg.wasm?v=4';
    const DEFAULT_DIFFICULTY = 'tricky';

    let secs = 0;
    const timer = setInterval(() => {
      document.getElementById('elapsed').textContent = `${++secs}s`;
    }, 1000);

    function showLoadingError(message) {
      clearInterval(timer);
      const loading = document.getElementById('loading');
      if (!loading) return;
      const spinner = loading.querySelector('.spinner');
      if (spinner) spinner.remove();
      const p = loading.querySelector('p') ?? loading.appendChild(document.createElement('p'));
      p.textContent = message;
      p.style.color = '#ff7070';
    }

    const t0 = performance.now();
    const response = await fetch(WASM_URL);
    const t1 = performance.now();
    console.log(`[game] fetch: ${((t1 - t0) / 1000).toFixed(2)}s`);
    await init({ module_or_path: response });
    const t2 = performance.now();
    console.log(`[game] compile+init: ${((t2 - t1) / 1000).toFixed(2)}s`);
    console.log(`[game] total: ${((t2 - t0) / 1000).toFixed(2)}s`);

    const canvas = document.getElementById('bevy-canvas');
    const params = new URLSearchParams(location.search);
    const mazeId = params.get('id');

    if (mazeId) {
      // /game/?id=<mazeId> — a specific stored maze. Skip the difficulty
      // config and let Bevy use Step 2 defaults (60 s clock, no seed/difficulty
      // reported in GameResult).
      const auth = JSON.parse(sessionStorage.getItem('auth') ?? 'null');
      const token = (auth && auth.token) || params.get('t');
      clearInterval(timer);
      document.getElementById('loading').querySelector('p').textContent = 'Loading maze…';
      const res = await fetch(`/api/v1/mazes/${encodeURIComponent(mazeId)}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (!res.ok) throw new Error('Failed to load maze');
      const maze = await res.json();
      const mazeJson = JSON.stringify(maze.definition);
      document.getElementById('loading').remove();
      canvas.focus({ preventScroll: true });
      start_with_maze(mazeJson);
    } else {
      // /game/?difficulty=<…> — fetch the server-side preset, allow a
      // ?seed=<n> override for replay / share variety, then start Bevy with
      // the assembled GameConfig.
      const difficulty = (params.get('difficulty') ?? DEFAULT_DIFFICULTY).trim();
      const configUrl = `/api/v1/game/play3d-config?difficulty=${encodeURIComponent(difficulty)}`;
      const cfgRes = await fetch(configUrl);
      if (cfgRes.ok) {
        const preset = await cfgRes.json();

        // Optional ?seed=<n> URL override — lets a user replay an exact maze
        // (or share its URL). Must parse as a finite integer; otherwise the
        // configured seed stays in effect.
        const seedOverride = params.get('seed');
        if (seedOverride !== null && seedOverride !== '') {
          const parsed = Number(seedOverride);
          if (Number.isFinite(parsed) && Number.isInteger(parsed)) {
            preset.seed = parsed;
          }
        }

        try {
          start_with_config(JSON.stringify(preset));
          clearInterval(timer);
          document.getElementById('loading').remove();
          canvas.focus({ preventScroll: true });
        } catch (err) {
          showLoadingError(`Failed to start game: ${err}`);
        }
      } else {
        const body = await cfgRes.text().catch(() => '');
        showLoadingError(`Failed to load Play 3D config (${cfgRes.status}): ${body || cfgRes.statusText}`);
      }
    }

    function fire(key, type) {
      canvas.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true }));
    }
    const btnDefs = [
      { label: 'Move forward', key: 'ArrowUp'    },
      { label: 'Turn left',    key: 'ArrowLeft'  },
      { label: 'Turn right',   key: 'ArrowRight' },
      { label: 'Tilt up',      key: 'KeyQ'       },
      { label: 'Tilt down',    key: 'KeyE'       },
    ];
    for (const { label, key } of btnDefs) {
      const btn = document.querySelector(`[aria-label="${label}"]`);
      btn.addEventListener('pointerdown',   e => { e.preventDefault(); fire(key, 'keydown'); });
      btn.addEventListener('pointerup',     e => { e.preventDefault(); fire(key, 'keyup'); });
      btn.addEventListener('pointerleave',  () => fire(key, 'keyup'));
      btn.addEventListener('pointercancel', () => fire(key, 'keyup'));
      btn.addEventListener('contextmenu',   e => e.preventDefault());
    }

    // Pause button — separate wiring because its glyph and aria-label
    // follow the Bevy paused state via the `maze-game-paused` event, so
    // a stable id is easier to target than a label that swaps.
    const pauseBtn = document.getElementById('pause-btn');
    if (pauseBtn) {
      pauseBtn.addEventListener('pointerdown',   e => { e.preventDefault(); fire('Space', 'keydown'); });
      pauseBtn.addEventListener('pointerup',     e => { e.preventDefault(); fire('Space', 'keyup');   });
      pauseBtn.addEventListener('pointerleave',  () => fire('Space', 'keyup'));
      pauseBtn.addEventListener('pointercancel', () => fire('Space', 'keyup'));
      pauseBtn.addEventListener('contextmenu',   e => e.preventDefault());
    }
    window.addEventListener('maze-game-paused', function (e) {
      const btn = document.getElementById('pause-btn');
      if (!btn) return;
      const img = btn.querySelector('img');
      const paused = !!(e.detail && e.detail.paused);
      if (img) img.src = paused ? '/images/maze/dpad_play.png' : '/images/maze/dpad_pause.png';
      btn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
    });

    // Canvas touch gestures — translate single-finger gestures to the same
    // synthetic key events the D-pad already uses, so the Bevy side stays
    // keyboard-driven. Swipe left/right → turn; swipe up/down → tilt
    // (one incremental nudge per swipe); press-and-hold with no movement
    // → move forward (held). Multi-touch is ignored to avoid pinch/zoom
    // misfires. The D-pad lives in a separate `#controls` strip below the
    // canvas, so its taps never hit these listeners.
    {
      const SWIPE_THRESHOLD = 30;   // px — minimum travel to classify as a swipe
      const HOLD_DELAY = 250;       // ms — touch must be held this long with no movement to count as a hold
      let touchStart = null;        // { x, y, lastX, lastY }
      let holdTimer = null;
      let holdActive = false;

      const cancelHold = () => {
        if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
        if (holdActive) { fire('ArrowUp', 'keyup'); holdActive = false; }
      };

      canvas.addEventListener('touchstart', e => {
        if (e.touches.length !== 1) {
          cancelHold();
          touchStart = null;
          return;
        }
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY, lastX: t.clientX, lastY: t.clientY };
        holdActive = false;
        holdTimer = setTimeout(() => {
          if (touchStart && !holdActive) {
            holdActive = true;
            fire('ArrowUp', 'keydown');
          }
        }, HOLD_DELAY);
      }, { passive: true });

      canvas.addEventListener('touchmove', e => {
        if (!touchStart || e.touches.length !== 1) return;
        const t = e.touches[0];
        touchStart.lastX = t.clientX;
        touchStart.lastY = t.clientY;
        // Once the touch has moved beyond the swipe threshold, it can no
        // longer promote to a hold — cancel the pending hold timer.
        if (!holdActive && holdTimer !== null) {
          const dx = t.clientX - touchStart.x;
          const dy = t.clientY - touchStart.y;
          if (Math.hypot(dx, dy) > SWIPE_THRESHOLD) {
            clearTimeout(holdTimer);
            holdTimer = null;
          }
        }
      }, { passive: true });

      canvas.addEventListener('touchend', () => {
        if (!touchStart) return;
        if (holdTimer !== null) { clearTimeout(holdTimer); holdTimer = null; }
        if (holdActive) {
          fire('ArrowUp', 'keyup');
          holdActive = false;
        } else {
          const dx = touchStart.lastX - touchStart.x;
          const dy = touchStart.lastY - touchStart.y;
          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          if (Math.max(absX, absY) >= SWIPE_THRESHOLD) {
            let key;
            if (absX > absY) {
              key = dx > 0 ? 'ArrowRight' : 'ArrowLeft';
            } else {
              // Screen y grows downward, so swipe UP (negative dy) = tilt up.
              key = dy < 0 ? 'KeyQ' : 'KeyE';
            }
            fire(key, 'keydown');
            fire(key, 'keyup');
          }
        }
        touchStart = null;
      }, { passive: true });

      canvas.addEventListener('touchcancel', () => {
        cancelHold();
        touchStart = null;
      }, { passive: true });
    }
  </script>
</body>
</html>
