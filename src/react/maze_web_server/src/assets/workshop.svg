<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Workshop gears">
  <defs>
    <linearGradient id="workshopSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd3ec"/>
      <stop offset="0.5" stop-color="#5b82ad"/>
      <stop offset="1" stop-color="#37567a"/>
    </linearGradient>
  </defs>
  <!-- large gear -->
  <g fill="url(#workshopSteel)" stroke="#2f4a68" stroke-width="3" stroke-linejoin="round">
    <g>
      <rect x="77" y="59" width="16" height="18" rx="3"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(45 85 112)"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(90 85 112)"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(135 85 112)"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(180 85 112)"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(225 85 112)"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(270 85 112)"/>
      <rect x="77" y="59" width="16" height="18" rx="3" transform="rotate(315 85 112)"/>
    </g>
    <circle cx="85" cy="112" r="40"/>
  </g>
  <circle cx="85" cy="112" r="15" fill="#2f4a68"/>
  <!-- small gear -->
  <g fill="url(#workshopSteel)" stroke="#2f4a68" stroke-width="3" stroke-linejoin="round">
    <g>
      <rect x="133" y="32" width="14" height="15" rx="3"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(45 140 66)"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(90 140 66)"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(135 140 66)"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(180 140 66)"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(225 140 66)"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(270 140 66)"/>
      <rect x="133" y="32" width="14" height="15" rx="3" transform="rotate(315 140 66)"/>
    </g>
    <circle cx="140" cy="66" r="24"/>
  </g>
  <circle cx="140" cy="66" r="9" fill="#2f4a68"/>
</svg>
