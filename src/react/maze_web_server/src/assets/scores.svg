<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Trophy">
  <defs>
    <linearGradient id="trophyGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.45" stop-color="#f7c948"/>
      <stop offset="1" stop-color="#d99a00"/>
    </linearGradient>
  </defs>
  <!-- handles -->
  <g fill="none" stroke="#e0a700" stroke-width="9" stroke-linecap="round">
    <path d="M62 52 C32 52 32 92 64 86"/>
    <path d="M138 52 C168 52 168 92 136 86"/>
  </g>
  <!-- cup -->
  <path d="M58 42 H142 V58 C142 94 123 110 100 110 C77 110 58 94 58 58 Z"
