# Application Configuration File

# Server port to listen on (default: 8443)
port = 8443

# Path to the built React app dist directory (relative to the server working directory,
# or absolute). For local development with the React app, set to:
#   ../../react/maze_web_server/dist
# If the directory does not exist, the server runs as API-only (no frontend served).
#static_dir = "static"
static_dir = "../../react/maze_web_server/dist"

[security]
# Path to TLS certificate file (default: "cert.pem")
cert_file = "cert.pem"

# Path to TLS private key file (default: "key.pem")
key_file = "key.pem"

# Login token expiry in hours (integer).
login_expiry_hours = 24

[security.password_hash]
# Argon2 memory cost in KiB (default: 65536 = 64 MiB)
# Higher values increase protection against brute-force attacks
#mem_cost = 65536

# Argon2 time cost (iterations) (default: 3)
# Higher values increase CPU usage
time_cost = 3

# Argon2 degree of parallelism (default: 4)
# Should match the number of CPU cores
lanes = 4

# Desired length of password hash output in bytes (default: 32)
# Common values: 32 (256-bit), 64 (512-bit)
hash_length = 32

[logging]
# Directory to write log files to (default: "logs")
# Relative to the server working directory
log_dir = "logs"

# Minimum log level to capture (default: "info")
# Valid values: error, warn, info, debug, trace
log_level = "info"

# Prefix used verbatim at the start of each log file name, including any separator.
# Log files are named {log_file_prefix}{YYYY-MM-DD}.log
# e.g. "maze_web_server_" produces "maze_web_server_2026-04-09.log"
log_file_prefix = "maze_web_server_"

[storage]
# Backend selector: "file" (on-disk JSON layout) or "sql" (SQLite/Postgres/MySQL).
# Can be overridden with `MAZE_WEB_SERVER_STORAGE_TYPE`.
type = "file"

[storage.file]
# Directory under which user/maze data is stored, relative to the working
# directory or absolute. Can be overridden with
# `MAZE_WEB_SERVER_STORAGE_FILE_DATA_DIR`.
data_dir = "data"

# ---- SQL backend (uncomment + set type = "sql" to use) ----
# Driver selection happens at runtime — one binary supports all three engines
# via SQLx's Any backend. The connection URL is assembled from these fields
# at startup; the password is *never* read from this file — set the
# `MAZE_WEB_SERVER_STORAGE_SQL_PASSWORD` env var instead (sqlite excepted, no auth).
# [storage.sql]
# driver = "postgres"            # "postgres", "mysql", or "sqlite"
# host = "your-db-host"          # postgres / mysql only
# port = 5432                    # postgres / mysql only
# database = "your_database"     # postgres / mysql only
# username = "your_app_user"     # postgres / mysql only
# path = "your_database.db"      # sqlite only
# max_connections = 5
# auto_create_database = false   # if true, create DB on first run if missing
#                                # (sqlite + dev only — cloud creds rarely have the privilege)
# require_tls = false            # set true for any host beyond localhost
# ca_cert_path = ""              # optional CA bundle for full TLS verification (cloud DBs)
# connect_timeout_secs = 10      # encoded into URL for postgres only
# idle_timeout_secs = 600
# acquire_timeout_secs = 30
# password: never stored here — set MAZE_WEB_SERVER_STORAGE_SQL_PASSWORD

[features]
# Whether new users can self-register via the signup endpoint (default: true).
# Can also be changed at runtime via PUT /api/v1/admin/features (admin only).
allow_signup = true

[oauth]
# Master switch for OAuth sign-in. When false, no OAuth buttons are shown in
# the front ends and no validation runs against the connector's section below.
enabled = false
# Which OAuthConnector implementation to use. "internal" speaks OAuth/OIDC
# directly to each provider; "auth0" is reserved for a future drop-in.
connector = "internal"
# URL scheme the MAUI app uses as its OAuth redirect target. The MAUI client
# must register this scheme in each platform's manifest.
mobile_redirect_scheme = "maze-app"

# ---- Internal connector: speaks OAuth/OIDC directly to each provider ----
# Client secrets are never stored here. Set the env var named in
# client_secret_env instead (e.g. MAZE_OAUTH_GOOGLE_SECRET).
[oauth.internal.providers.google]
enabled = false
display_name = "Google"
client_id = ""
client_secret_env = "MAZE_OAUTH_GOOGLE_SECRET"
redirect_uri = "https://your-host:8443/api/v1/auth/oauth/google/callback"

[oauth.internal.providers.github]
enabled = false
display_name = "GitHub"
client_id = ""
client_secret_env = "MAZE_OAUTH_GITHUB_SECRET"
redirect_uri = "https://your-host:8443/api/v1/auth/oauth/github/callback"

[oauth.internal.providers.facebook]
enabled = false
display_name = "Facebook"
client_id = ""
client_secret_env = "MAZE_OAUTH_FACEBOOK_SECRET"
redirect_uri = "https://your-host:8443/api/v1/auth/oauth/facebook/callback"

# ---- Auth0 connector (placeholder, not implemented yet) ----
# [oauth.auth0]
# domain = "your-tenant.auth0.com"
# client_id = ""
# client_secret_env = "MAZE_AUTH0_SECRET"
# audience = "https://your-host/api"

# ---- Outbound communications ----
# Email-provider settings and branding values for templated messages.
# Provider secrets (api keys) are read from environment variables only —
# never from this file.
#
# `comms.enabled` is the master switch. When false (the default), startup
# validation skips both the universal-field check and the per-provider
# env-var checks. When true, the universal file-only fields
# (`public_base_url` + `email.from`) hard-fail config load if empty;
# env-var-sourced provider secrets (Mailgun API key, SMTP+OAuth2 client
# secret) emit startup warnings rather than blocking startup.
# [comms]
# enabled = false
# public_base_url = "https://your-host:8443"

# Branding values referenced by the templated-message partials
# ({{ logo }}, {{ header }}, {{ footer }}) and templates ({{ app_name }},
# {{ company_url }}). copyright_year is taken from the current UTC year
# at render time and is not configurable here. company_url defaults to
# public_base_url when left unset; set it explicitly only if the company
# website lives at a different domain from the server deployment.
# `app_name` is the product name used in template subjects/bodies (e.g.
# "Maze"). It is distinct from `comms.email.from_name` (the From-header
# display name, e.g. "The Maze Team") so the body can read "Reset your
# Maze password" while the From header still reads "The Maze Team
# <noreply@…>". When unset, falls back to from_name, then company_name.
# [comms.branding]
# app_name = "Acme"
# company_name = "Acme, Inc."
# company_address = "123 Example St, City, Country"
# company_url = "https://acme.example.com"
# logo_url = "https://your-host:8443/static/logo.png"

# Email-medium config. `provider` selects the active sub-table:
# "stub" (in-memory capture) or "mailgun". `from` / `from_name` are the
# sender identity used when send_template synthesises a message;
# `from_name` defaults to "The Maze Team" if omitted. `templates_dir`
# is the directory holding filesystem-override templates and partials
# for the email medium; templates not present there fall back to the
# embedded defaults compiled into the server.
# [comms.email]
# provider = "mailgun"
# from = "noreply@example.com"
# from_name = "The Maze Team"
# templates_dir = "config/email_templates"

# Email audit-log behaviour. Applies to every provider — medium-level,
# not provider-specific. Currently a single toggle for the
# anti-enumeration "recon row" written when /password-reset/request is
# hit with an email that doesn't match a verified user. Default off so
# small / dev installs don't accumulate one audit-log entry per typo or
# probe; flip on for rate-limit / abuse forensics. The 200 response and
# anti-enumeration timing floor are unaffected either way.
# [comms.email.audit]
# record_unknown_password_reset_requests = false

# Mailgun-specific settings. Consulted only when provider = "mailgun".
# api_key is read from MAZE_WEB_SERVER_COMMS_EMAIL_MAILGUN_API_KEY at
# startup and is never read from this file.
# [comms.email.mailgun]
# domain = "mg.example.com"
# region = "us"  # "us" or "eu"

# SMTP+XOAUTH2 settings. Consulted only when provider = "smtp_oauth2".
# Pairs the SMTP relay (host/port/tls/username) with the OAuth vendor that
# mints bearer tokens, selected by `vendor`:
#   "microsoft"        — Azure AD client-credentials flow against a registered
#       app with Mail.Send (or equivalent) constrained to a single mailbox.
#       Typical for Microsoft 365. The client secret is environment-only —
#       MAZE_WEB_SERVER_COMMS_EMAIL_SMTP_OAUTH2_MICROSOFT_CLIENT_SECRET.
#   "google"           — Workspace service-account JWT-bearer flow, typically
#       with domain-wide delegation. The private key lives in the JSON key
#       file at service_account_json_path.
#   "google_personal"  — per-user OAuth refresh-token flow for personal
#       @gmail.com accounts (Workspace's domain-wide delegation isn't
#       available against consumer Gmail). The operator does the consent
#       dance once out-of-band (e.g. via Google's OAuth Playground) and
#       supplies the resulting refresh token via the env var below.
# [comms.email.smtp_oauth2]
# host = "smtp.office365.com"          # M365: smtp.office365.com  | Gmail: smtp.gmail.com
# port = 587                           # 587 = STARTTLS, 465 = implicit TLS
# tls = "starttls"                     # "starttls" | "implicit" | "plain"
# username = "noreply@contoso.com"     # SASL identity (typically the From mailbox)
# vendor = "microsoft"                 # | "google" | "google_personal"
#
# # ---- Microsoft 365 (Azure AD client-credentials) ----
# [comms.email.smtp_oauth2.microsoft]
# tenant_id = "00000000-0000-0000-0000-000000000000"
# client_id = "00000000-0000-0000-0000-000000000000"
# scopes    = ["https://outlook.office.com/.default"]
# # client_secret — env-only:
# #   MAZE_WEB_SERVER_COMMS_EMAIL_SMTP_OAUTH2_MICROSOFT_CLIENT_SECRET
#
# # ---- Google Workspace (service-account + domain-wide delegation) ----
# [comms.email.smtp_oauth2.google]
# service_account_json_path = "/etc/maze/gcp-service-account.json"
# delegated_subject         = "noreply@company.com"
# scopes                    = ["https://www.googleapis.com/auth/gmail.send"]
#
# # ---- Personal Gmail (OAuth refresh-token flow) ----
# [comms.email.smtp_oauth2.google_personal]
# client_id = "1234567890-abc.apps.googleusercontent.com"
# scopes    = ["https://mail.google.com/"]   # required for SMTP — gmail.send is API-only
# # client_secret  — env-only:
# #   MAZE_WEB_SERVER_COMMS_EMAIL_SMTP_OAUTH2_GOOGLE_PERSONAL_CLIENT_SECRET
# # refresh_token  — env-only:
# #   MAZE_WEB_SERVER_COMMS_EMAIL_SMTP_OAUTH2_GOOGLE_PERSONAL_REFRESH_TOKEN

