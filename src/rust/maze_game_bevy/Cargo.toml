[package]
name = "maze_game_bevy"
version = "0.1.0"
edition = "2021"

[lib]
name = "maze_game_bevy"
path = "src/lib.rs"

[[bin]]
name = "maze_game_bevy"
path = "src/main.rs"

[dependencies]
maze = { path = "../maze" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_winit",
    "x11",
    "default_font",
    "tonemapping_luts",
    "zstd_rust",
] }

# Browser-host dispatch surface — used only when targeting wasm32 so native
# builds (cargo run -p maze_game_bevy) remain free of web_sys / wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "EventTarget", "CustomEvent", "CustomEventInit"] }
