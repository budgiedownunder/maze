[package]
name = "maze_game_bevy_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt crashes on the default-release WASM
# (binaryen Precompute internal error). Run wasm-opt manually as a
# separate post-build step for the size-optimised build only — see
# this crate's README.
wasm-opt = false

[dependencies]
maze_game_bevy = { path = "../maze_game_bevy" }
bevy = { version = "0.18", default-features = false, features = ["webgl2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
