[package]
name = "comms"
version = "0.1.0"
edition = "2021"
description = "Outbound communications crate for the maze project"

[features]
default = []
# Enables `StubEmailProvider` / `StubSmsProvider` — in-memory provider impls
# that capture dispatched messages instead of sending them. Intended for use
# in downstream test crates' `dev-dependencies`.
stub = []
# Enables `ClientCredentialsTokenSource` — Microsoft Azure AD OAuth2
# client_credentials flow, used by Microsoft 365 / Microsoft Graph providers.
oauth2-microsoft = ["dep:reqwest"]
# Enables `ServiceAccountTokenSource` — Google Workspace OAuth2 JWT-bearer
# flow, used by Gmail API providers (with optional domain-wide delegation).
oauth2-google = ["dep:reqwest", "dep:jsonwebtoken"]
# Enables `MailgunProvider` — `EmailProvider` impl backed by the Mailgun
# HTTP API (https://api.mailgun.net or the EU regional host).
provider-mailgun = ["dep:reqwest"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "9", optional = true }
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
toml = "0.8"
url = { version = "2", features = ["serde"] }
uuid = { version = "1.7", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "net", "test-util"] }
wiremock = "0.6"
