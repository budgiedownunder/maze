[workspace]

members = [ "auth", "comms", "data_model", "maze", "maze_c", "maze_console", "maze_game_bevy", "maze_game_bevy_wasm", "maze_openapi_generator", "maze_wasm", "maze_web_server", "storage", "utils"]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.release.package.maze_game_bevy_wasm]
opt-level = "z"
strip = "symbols"

[profile.release.package.maze_game_bevy]
opt-level = "z"
strip = "symbols"
