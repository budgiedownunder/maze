<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Game">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <symbol id="pad" viewBox="0 0 64 32">
      <rect x="7" y="4" width="50" height="24" rx="12" fill="url(#g)"/>
      <rect x="15" y="14" width="13" height="4.2" rx="2" fill="#fff"/>
      <rect x="19.4" y="9.6" width="4.2" height="13" rx="2" fill="#fff"/>
      <circle cx="42" cy="12.5" r="2.7" fill="#fff"/>
      <circle cx="48.5" cy="19" r="2.7" fill="#fff"/>
      <circle cx="42" cy="19" r="2.7" fill="#fff" opacity=".7"/>
    </symbol>
  </defs>
  <!-- Enlarged and vertically centred (MAUI shows no visibility badge, so unlike
       React's badge-offset thumbnail it needn't leave a corner clear). The margin
       around the glyph is applied by the GameImageView frame, not baked in here. -->
  <use href="#pad" x="-8" y="12" width="80" height="40"/>
</svg>
